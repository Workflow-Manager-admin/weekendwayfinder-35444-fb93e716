<div class="planner-bg">
  <div class="planner-container">
    <h2>Plan Your Weekend Getaway</h2>
    <form [formGroup]="plannerForm" (ngSubmit)="submitPlanner()">
      <div class="planner-row">
        <label for="location">Starting Point</label>
        <input type="text" id="location" formControlName="location" placeholder="Enter your city or ZIP" />
      </div>
      <div class="planner-row">
        <label for="distance">Max Distance (miles)</label>
        <input type="range" id="distance" formControlName="distance" min="5" max="200" step="5" />
        <span class="range-value">{{ plannerForm.controls['distance'].value }} mi</span>
      </div>
      <div class="planner-row">
        <label for="budget">Budget ($)</label>
        <input type="number" id="budget" formControlName="budget" min="30" max="2000"/>
      </div>
      <div class="planner-row">
        <label for="mood">Trip Mood</label>
        <select id="mood" formControlName="mood">
          <option *ngFor="let m of moods" [value]="m.value">{{ m.label }}</option>
        </select>
      </div>
      <button type="submit" [disabled]="plannerForm.invalid">Get AI Suggestions</button>
    </form>
    <div *ngIf="plannerForm.invalid && plannerForm.touched" class="error-msg">
      Please fill out all required fields.
    </div>
    <ww-ai-trip-suggestions *ngIf="showSuggestions" [criteria]="formData"></ww-ai-trip-suggestions>
  </div>
</div>
